services:
  - type: web
    name: infinity-new
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SERVE_WEB
        value: "true"
      - key: PUBLIC_BASE_URL
        value: "https://infinity-new.onrender.com"
      - key: CORS_ORIGIN
        value: "https://infinity-new.onrender.com"
      # โหมดทดสอบจนกว่าจะมี Twilio / Omise จริง — ปิดเมื่อขึ้น live
      - key: ALLOW_DEV_OTP
        value: "true"
      - key: OMISE_ALLOW_SIMULATE
        value: "true"
      # ทางเลือก: ผูก Render Postgres แล้วใส่ Internal URL ที่นี่
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PHONES
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: OMISE_SECRET_KEY
        sync: false
      - key: OMISE_PUBLIC_KEY
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: LINE_CHANNEL_ID
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
