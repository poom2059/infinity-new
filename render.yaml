services:
  - type: web
    name: infinity-app
    runtime: node
    plan: free
    region: singapore
    # ใช้ cd server ในคำสั่ง เพื่อให้ทำงานแม้ Root Directory ไม่ถูกตั้ง
    buildCommand: cd server && npm install --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SERVE_WEB
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
