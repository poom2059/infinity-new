<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Infinity food delivery">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="INFINITY">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>INFINITY</title>
  <link rel="manifest" href="manifest.json">

  <!-- ล้าง service worker/แคชเก่า ไม่ให้เสิร์ฟบันเดิลเวอร์ชันก่อนหน้า -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      }).catch(function () {});
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key); });
        }).catch(function () {});
      }
    })();
  </script>

  <!-- Google Maps JS — key จาก window.__GOOGLE_MAPS_API_KEY หรือ meta (inject ตอน build) -->
  <script>
    (function () {
      var key = window.__GOOGLE_MAPS_API_KEY || '';
      if (!key) {
        try {
          var m = document.querySelector('meta[name="google-maps-api-key"]');
          if (m) key = m.getAttribute('content') || '';
        } catch (e) {}
      }
      if (!key) return;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) +
        '&language=th&region=TH&libraries=places';
      document.head.appendChild(s);
    })();
  </script>
  <meta name="google-maps-api-key" content="">
</head>
<body>
  <script src="flutter_bootstrap.js?v=20260818-session" async></script>
</body>
</html>
