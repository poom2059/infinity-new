<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Infinity food delivery">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="infinity_new">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>infinity_new</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Maps JS — key จาก window.__GOOGLE_MAPS_API_KEY หรือ query (inject ตอน build) -->
  <script>
    (function () {
      var key = window.__GOOGLE_MAPS_API_KEY || '';
      if (!key) {
        try {
          var m = document.querySelector('meta[name="google-maps-api-key"]');
          if (m) key = m.getAttribute('content') || '';
        } catch (e) {}
      }
      if (!key) return;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) +
        '&language=th&region=TH&libraries=places';
      document.head.appendChild(s);
    })();
  </script>
  <meta name="google-maps-api-key" content="">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
